name: Fork image

# Manual only. Builds the linux/amd64 image from the selected branch and
# pushes it to GitHub's registry under the fork owner. Nothing runs on a
# push, a pull request or a schedule.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag, for example fix-input-window-1
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push (linux/amd64)
    timeout-minutes: 180
    # An x86-64 runner, so the build is native. The node host is x86-64.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub's registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Show the published digest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ inputs.tag }} --format '{{json .Manifest}}'
